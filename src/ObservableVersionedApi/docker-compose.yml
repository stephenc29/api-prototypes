services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: observable-versioned-api
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
        ports: 
            - "8080:8080"
            - "8081:8081" 
        networks:
            - monitoring

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - "9090:9090"
        networks:
            - monitoring
    
    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        volumes:
            - grafana-data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning
        ports:
            - "3000:3000"
        networks:
            - monitoring
        depends_on: 
            - prometheus

networks:
    monitoring:
        driver: bridge

volumes:
    grafana-data: